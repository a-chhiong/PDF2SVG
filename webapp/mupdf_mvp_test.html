<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>PDF2SVG - MuPDF.js MVP Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a; color: #e2e8f0;
            padding: 24px; max-width: 1200px; margin: 0 auto;
        }
        h1 { color: #38bdf8; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }

        .controls {
            display: flex; gap: 12px; align-items: center;
            margin-bottom: 16px; flex-wrap: wrap;
        }
        select, button {
            background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
            padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer;
        }
        button { background: #2563eb; border-color: #3b82f6; font-weight: 600; }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .log-box {
            background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            padding: 16px; margin-bottom: 16px; font-family: 'Cascadia Code', monospace;
            font-size: 13px; line-height: 1.6; min-height: 120px; max-height: 300px;
            overflow-y: auto;
        }
        .log-box p { margin: 2px 0; }

        .preview-box {
            background: #fff; border: 1px solid #334155; border-radius: 8px;
            padding: 8px; min-height: 200px; overflow: auto;
        }
        .preview-box svg { max-width: 100%; height: auto; }

        .stats { display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            padding: 12px 20px; min-width: 150px;
        }
        .stat-label { color: #94a3b8; font-size: 12px; text-transform: uppercase; }
        .stat-value { color: #38bdf8; font-size: 24px; font-weight: 700; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>🧪 MuPDF.js — MVP Theory Test</h1>
    <p class="subtitle">
        Testing MuPDF WASM for PDF→SVG conversion with text-as-path vectorization.
        Comparing output quality against the consoleapp benchmark.
    </p>

    <div class="controls">
        <select id="pdf-select">
            <option value="/examples/中台設定檔 - 登機證票面(國內).pdf">登機證票面(國內).pdf</option>
            <option value="/examples/中台設定檔 - 登機證QRCode(國內).pdf">登機證QRCode(國內).pdf</option>
            <option value="/examples/中台設定檔 - 登機證QRCode(國際或兩岸).pdf">登機證QRCode(國際或兩岸).pdf</option>
        </select>
        <button id="run-btn">▶ Run MuPDF Conversion</button>
    </div>

    <div class="stats" id="stats-row" style="display:none;">
        <div class="stat-card">
            <div class="stat-label">Pages</div>
            <div class="stat-value" id="stat-pages">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">SVG Text Elements</div>
            <div class="stat-value" id="stat-text">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">SVG Path Elements</div>
            <div class="stat-value" id="stat-paths">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Time</div>
            <div class="stat-value" id="stat-time">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">SVG Size</div>
            <div class="stat-value" id="stat-size">-</div>
        </div>
    </div>

    <div class="log-box" id="log"></div>

    <h2 style="color: #38bdf8; margin-bottom: 12px;">SVG Output Preview</h2>
    <div class="preview-box" id="svg-preview">
        <span style="color: #64748b;">No SVG rendered yet</span>
    </div>

    <script type="module">
        import * as mupdf from "mupdf";

        const logEl = document.getElementById('log');
        const previewEl = document.getElementById('svg-preview');
        const statsRow = document.getElementById('stats-row');

        function log(msg, color) {
            const p = document.createElement('p');
            if (color) p.style.color = color;
            p.textContent = msg;
            logEl.appendChild(p);
            logEl.scrollTop = logEl.scrollHeight;
        }

        document.getElementById('run-btn').addEventListener('click', async () => {
            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            logEl.innerHTML = '';
            previewEl.innerHTML = '<span style="color: #64748b;">Rendering...</span>';
            statsRow.style.display = 'none';

            const pdfUrl = document.getElementById('pdf-select').value;
            log(`🔄 Fetching PDF: ${pdfUrl}`);

            try {
                const startTime = performance.now();

                // 1. Fetch the PDF file
                const response = await fetch(pdfUrl);
                if (!response.ok) throw new Error(`Failed to fetch PDF: ${response.status}`);
                const arrayBuffer = await response.arrayBuffer();
                log(`✓ PDF fetched: ${(arrayBuffer.byteLength / 1024).toFixed(1)} KB`, '#22c55e');

                // 2. Open with MuPDF
                log('🔄 Opening document with MuPDF WASM...');
                const doc = mupdf.Document.openDocument(arrayBuffer, "application/pdf");
                const pageCount = doc.countPages();
                log(`✓ Document opened: ${pageCount} page(s)`, '#22c55e');

                // 3. Convert page 1 to SVG using DocumentWriter with text=path
                log('🔄 Converting page 1 to SVG (text=path mode)...');

                const page = doc.loadPage(0);
                const bounds = page.getBounds();
                log(`  Page bounds: [${bounds.map(b => b.toFixed(1)).join(', ')}]`);

                // Use DocumentWriter to produce SVG with text as paths
                const buf = new mupdf.Buffer();
                const writer = new mupdf.DocumentWriter(buf, "svg", "text=path");
                const dev = writer.beginPage([bounds[0], bounds[1], bounds[2], bounds[3]]);
                page.runPageContents(dev, mupdf.Matrix.identity);
                page.runPageAnnots(dev, mupdf.Matrix.identity);
                writer.endPage();
                writer.close();

                const svgString = buf.asString();
                const elapsed = performance.now() - startTime;

                log(`✓ SVG generated: ${(svgString.length / 1024).toFixed(1)} KB in ${elapsed.toFixed(0)}ms`, '#22c55e');

                // 4. Parse and analyse the SVG
                const parser = new DOMParser();
                const svgDoc = parser.parseFromString(svgString, 'image/svg+xml');
                const svgElement = svgDoc.documentElement;

                const textEls = svgElement.querySelectorAll('text');
                const pathEls = svgElement.querySelectorAll('path');

                log(`📊 SVG Analysis:`, '#38bdf8');
                log(`  • <text> elements: ${textEls.length} (should be 0 in text=path mode)`);
                log(`  • <path> elements: ${pathEls.length} (vectorized glyphs)`);
                log(`  • viewBox: ${svgElement.getAttribute('viewBox')}`);
                log(`  • width: ${svgElement.getAttribute('width')}`);
                log(`  • height: ${svgElement.getAttribute('height')}`);

                // Check if text was successfully vectorized
                if (textEls.length === 0 && pathEls.length > 0) {
                    log(`🎉 SUCCESS: All text converted to vector paths! No <text> elements remain.`, '#22c55e');
                    log(`   This matches the consoleapp's output quality.`, '#22c55e');
                } else if (textEls.length > 0) {
                    log(`⚠️ WARNING: ${textEls.length} <text> elements still present.`, '#f59e0b');
                    log(`   text=path mode may not have fully worked.`, '#f59e0b');
                }

                // Update stats
                statsRow.style.display = 'flex';
                document.getElementById('stat-pages').textContent = pageCount;
                document.getElementById('stat-text').textContent = textEls.length;
                document.getElementById('stat-paths').textContent = pathEls.length;
                document.getElementById('stat-time').textContent = `${elapsed.toFixed(0)}ms`;
                document.getElementById('stat-size').textContent = `${(svgString.length / 1024).toFixed(0)}KB`;

                // 5. Display the SVG
                previewEl.innerHTML = '';
                previewEl.appendChild(svgElement);

                log(`\n✅ Conversion complete.`, '#22c55e');

            } catch (e) {
                log(`✗ Error: ${e.message}`, '#ef4444');
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
